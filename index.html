<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superman: Banánová válka</title><style>body{font-family:system-ui;background:#141629;color:white;text-align:center;margin:0;padding:14px}canvas{width:min(96vw,760px);height:auto;background:#77b36e;border:3px solid #8562ac;border-radius:15px;touch-action:none}button{background:#44316e;color:white;border:1px solid #a98de3;border-radius:12px;padding:13px;font-size:19px;min-width:52px;touch-action:none}#bar{margin:12px}#controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;max-width:760px;margin:12px auto}</style><h2>🦸 Superman: Banánová válka 🍌</h2><div id="bar">❤️ <span id="hp">100</span>　🍌 <span id="ban">0</span>/12　🚜 <span id="tank">4</span>　⚡ <span id="energy">100</span></div><canvas id="canvas" width="760" height="480"></canvas><p id="msg">Sbírej banány a znič všechny tanky!</p><div id="controls"><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button><button data-key="fire">⚡ Laser</button><button id="fly">🦸 Let</button><button id="restart">↻ Znovu</button></div><p>Šipky nebo WASD = pohyb, mezerník = laser, Shift = let</p><script>
const c=document.getElementById('canvas'),g=c.getContext('2d'),keys=new Set();let p,bananas,tanks,lasers,enemyBullets,hp,energy,collected,fly,inv,mode,frame;
const el=id=>document.getElementById(id),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function reset(){p={x:50,y:425,dir:1};hp=100;energy=100;collected=0;fly=false;inv=0;mode='play';frame=0;keys.clear();lasers=[];enemyBullets=[];bananas=Array.from({length:12},(_,i)=>({x:75+(i*149)%625,y:65+(i*89)%340}));tanks=[{x:200,y:135,h:3,v:1},{x:450,y:170,h:3,v:-1},{x:615,y:315,h:3,v:1},{x:300,y:355,h:3,v:-1}];el('msg').textContent='Sbírej banány a znič všechny tanky!';hud()}
function hud(){el('hp').textContent=Math.max(0,Math.ceil(hp));el('ban').textContent=collected;el('tank').textContent=tanks.length;el('energy').textContent=Math.floor(energy)}
function shoot(){if(mode!=='play'||energy<8)return;energy-=8;lasers.push({x:p.x+18*p.dir,y:p.y-6,v:10*p.dir})}
function hurt(){if(inv||fly||mode!=='play')return;hp-=12;inv=40;if(hp<=0){mode='lost';el('msg').textContent='Konec hry! Klikni na Znovu.'}}
function update(){frame++;if(mode==='play'){let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));if(dx||dy){let n=Math.hypot(dx,dy),s=fly&&energy>0?5:3;p.x=Math.max(20,Math.min(740,p.x+dx/n*s));p.y=Math.max(25,Math.min(455,p.y+dy/n*s));if(dx)p.dir=dx}if(fly)energy=Math.max(0,energy-.2);else energy=Math.min(100,energy+.13);if(energy===0)fly=false;if(keys.has('fire')&&frame%12===0)shoot();inv=Math.max(0,inv-1);bananas=bananas.filter(b=>{if(distance(p,b)<25){collected++;return false}return true});for(const t of tanks){t.x+=t.v*.7;if(t.x<60||t.x>700)t.v*=-1;if(distance(p,t)<34)hurt();if(frame%95===0){let a=Math.atan2(p.y-t.y,p.x-t.x);enemyBullets.push({x:t.x,y:t.y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4})}}for(const b of lasers){b.x+=b.v;for(const t of tanks)if(distance(b,t)<30){t.h--;b.dead=true}}lasers=lasers.filter(b=>!b.dead&&b.x>0&&b.x<760);tanks=tanks.filter(t=>t.h>0);for(const b of enemyBullets){b.x+=b.vx;b.y+=b.vy;if(distance(p,b)<18){hurt();b.dead=true}}enemyBullets=enemyBullets.filter(b=>!b.dead&&b.x>0&&b.x<760&&b.y>0&&b.y<480);if(collected===12&&tanks.length===0){mode='won';el('msg').textContent='🏆 Vyhrál jsi! Všechny banány jsou zachráněny.'}hud()}draw();requestAnimationFrame(update)}
function draw(){g.fillStyle='#79b16e';g.fillRect(0,0,760,480);g.fillStyle='#49a8d4';g.beginPath();g.moveTo(0,370);g.bezierCurveTo(170,300,290,450,440,370);g.bezierCurveTo(600,310,660,400,760,350);g.lineTo(760,480);g.lineTo(0,480);g.fill();g.lineCap='round';g.strokeStyle='#e2bd84';g.lineWidth=24;for(const a of [[45,420,700,75],[75,100,690,370]]){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(a[2],a[3]);g.stroke()}g.lineWidth=1;for(let i=0;i<35;i++){let x=18+(i*109)%730,y=22+(i*73)%400;g.fillStyle='#795437';g.fillRect(x-3,y,6,14);g.fillStyle=i%2?'#347b4e':'#27654b';g.beginPath();g.arc(x,y,13,0,Math.PI*2);g.fill()}g.fillStyle='#555666';g.fillRect(630,30,90,75);g.fillStyle='#a46cce';g.fillRect(659,57,30,48);g.font='25px sans-serif';g.textAlign='center';for(const b of bananas)g.fillText('🍌',b.x,b.y);for(const t of tanks){g.fillStyle='#293d2f';g.fillRect(t.x-29,t.y-15,58,33);g.fillStyle='#647d52';g.fillRect(t.x-24,t.y-20,48,35);g.fillStyle='#293b30';g.fillRect(t.x+5,t.y-6,36,10);g.fillStyle='#9cab8b';g.beginPath();g.arc(t.x,t.y-4,11,0,7);g.fill();g.fillStyle='#ef5656';g.fillRect(t.x-23,t.y-29,t.h*15,5)}for(const b of lasers){g.fillStyle='#fff258';g.beginPath();g.arc(b.x,b.y,6,0,7);g.fill()}for(const b of enemyBullets){g.fillStyle='#e65a43';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}if(!inv||frame%6<3){g.save();g.translate(p.x,p.y);g.scale(p.dir,1);g.fillStyle='#d62b3e';g.beginPath();g.moveTo(-8,-8);g.lineTo(-33,20);g.lineTo(-13,28);g.lineTo(5,10);g.fill();g.fillStyle='#1766bf';g.fillRect(-11,-10,22,29);g.fillStyle='#eac19b';g.beginPath();g.arc(0,-20,10,0,7);g.fill();g.fillStyle='#25232b';g.fillRect(-9,-29,17,6);g.fillStyle='#ffd03e';g.fillRect(-8,0,16,7);g.fillStyle='#d62b3e';g.fillRect(-10,17,8,13);g.fillRect(3,17,8,13);if(fly){g.fillStyle='#d2faff';g.fillRect(-8,29,6,14);g.fillRect(4,29,6,14)}g.restore()}if(mode!=='play'){g.fillStyle='rgba(16,15,40,.82)';g.fillRect(110,150,540,160);g.fillStyle='white';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText(mode==='won'?'🏆 VÍTĚZSTVÍ!':'💥 KONEC HRY',380,218);g.font='19px sans-serif';g.fillText('Klikni na ↻ Znovu',380,266)}}
const keymap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',' ':'fire'};window.addEventListener('keydown',e=>{if(keymap[e.key]){e.preventDefault();keys.add(keymap[e.key])}if(e.key==='Shift'&&!e.repeat)fly=!fly});window.addEventListener('keyup',e=>{if(keymap[e.key])keys.delete(keymap[e.key])});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{keys.add(k);if(k==='fire')shoot();b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});el('fly').addEventListener('click',()=>fly=!fly);el('restart').addEventListener('click',reset);reset();update();
</script></html>
